<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Battle Isle 2 map viewer</title>
    <link rel="stylesheet" href="/src/web/style.css" />
  </head>
  <body>
    <header class="toolbar">
      <a class="back" href="./">‹ Games</a>
      <h1>Battle Isle 2 · maps only</h1>
      <label class="check"><input type="checkbox" id="show-units" checked /> Units</label>
      <label class="select">Zoom
        <select id="zoom">
          <option value="1">1×</option>
          <option value="2" selected>2×</option>
          <option value="3">3×</option>
          <option value="4">4×</option>
        </select>
      </label>
      <label class="select">Ground
        <select id="weather">
          <option value="0" selected>as the map has it</option>
          <option value="1">picture 2</option>
          <option value="2">picture 3</option>
          <option value="3">picture 4</option>
          <option value="4">picture 5</option>
        </select>
      </label>
      <output id="field-info" class="field-info">Move over the map to inspect a field; click one to pin it.</output>
    </header>

    <nav class="maps" aria-label="Missions">
      <div id="map-list"></div>
    </nav>

    <main class="stage" id="stage">
      <div class="canvas-wrap" id="canvas-wrap">
        <canvas id="map"></canvas>
        <canvas id="overlay"></canvas>
      </div>
      <p id="message" class="message" hidden></p>
    </main>

    <aside class="details" id="details" aria-label="Mission details"></aside>

    <script type="module" src="/src/web/bi2.ts"></script>
  </body>
</html>
