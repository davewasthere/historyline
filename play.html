<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Battle</title>
    <link rel="stylesheet" href="/src/web/style.css" />
  </head>
  <body class="play">
    <header class="toolbar">
      <a id="back" class="back" href="maps.html">‹ Maps</a>
      <h1 id="battle-title">Battle</h1>
      <output id="field-info" class="field-info">Move over the map to inspect a field; click one to pin it.</output>
    </header>

    <main class="stage" id="stage">
      <div class="canvas-wrap" id="canvas-wrap">
        <canvas id="map"></canvas>
        <canvas id="overlay"></canvas>
      </div>
      <p id="message" class="message" hidden></p>
    </main>

    <div
      class="resizer"
      id="resizer"
      role="separator"
      aria-orientation="vertical"
      aria-label="Width of the side panel"
      tabindex="0"
      title="Drag to make the side panel wider or narrower; double-click for its usual width"
    ></div>

    <aside class="details" id="side" aria-label="Turn and details">
      <section class="turn-box" aria-label="Turn">
        <div id="turn-status" class="turn-status" aria-live="polite"></div>
        <button type="button" id="end-turn">End turn</button>
        <div class="turn-row">
          <button type="button" id="restart">Restart</button>
          <button type="button" id="save">Save</button>
          <button type="button" id="load">Load</button>
        </div>
        <div class="turn-row">
          <label class="check"><input type="checkbox" id="show-units" checked /> Units</label>
          <label class="select">Zoom
            <select id="zoom">
              <option value="1">1×</option>
              <option value="2" selected>2×</option>
              <option value="3">3×</option>
              <option value="4">4×</option>
            </select>
          </label>
        </div>
      </section>
      <div class="details-body" id="details"></div>
    </aside>

    <dialog id="inside" class="inside" aria-labelledby="inside-title">
      <div id="inside-body" class="inside-body"></div>
    </dialog>

    <dialog id="fight" class="fight" aria-labelledby="fight-title">
      <div id="fight-body" class="fight-body"></div>
    </dialog>

    <script type="module" src="/src/web/play.ts"></script>
  </body>
</html>
