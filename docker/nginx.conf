# Serves the built viewer, and under /game the files `npm run extract` took
# from the games, the way the development server does: a request for a folder
# is answered with the list of its files, which the extract wrote beside them
# as index.json.

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html index.json;

  gzip on;
  gzip_types application/javascript application/json application/octet-stream text/css;

  location /game/ {
    # The games' files have endings of their own (.FIN, .LIB, .DAT): they are bytes.
    default_type application/octet-stream;
  }
}
